spring:
  application:
    name: telemetry-processor-service
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/telemetry_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates the table structure for development
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500 # Optimization for our bulk inserts
        order_inserts: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: industrial-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500 # How many messages to grab in a single batch
    listener:
      type: batch # Instructs Spring to pass a List<ConsumerRecord> to the listener

  # Enable Java 21 Virtual Threads
  threads:
    virtual:
      enabled: true